# WatchForge — nginx konfigurácia pre web UI kontajner (S9-1)
# Statické Angular súbory + reverzný proxy /api → WatchForge.Api

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular SPA: všetky cesty → index.html (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API proxy → kontajner api:8080
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Clips streamovanie (video súbory) — bez bufferingu
    location /api/v1/clips/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    # Static assets cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
